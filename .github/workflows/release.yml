name: Release software
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12 && uv venv --python 3.12
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check src tests && uv run pytest -q && uv run python -m build
      - name: Validate software artifacts
        run: uv run python scripts/check_distribution.py dist
      - name: Publish tagged software artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --generate-notes
